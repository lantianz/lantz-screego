services:
  lantz-screego:
    image: ${LANTZ_SCREEGO_IMAGE}
    container_name: ${LANTZ_SCREEGO_CONTAINER_NAME}
    restart: unless-stopped
    network_mode: host
    environment:
      SCREEGO_SECRET: ${SCREEGO_SECRET}
      SCREEGO_EXTERNAL_IP: ${SCREEGO_EXTERNAL_IP}
      SCREEGO_SERVER_ADDRESS: ${SCREEGO_SERVER_ADDRESS}
      SCREEGO_TURN_ADDRESS: ${SCREEGO_TURN_ADDRESS}
      SCREEGO_TURN_EXTERNAL_PORT: ${SCREEGO_TURN_EXTERNAL_PORT}
      SCREEGO_TURN_DENY_PEERS: ${SCREEGO_TURN_DENY_PEERS}
      SCREEGO_AUTH_MODE: ${SCREEGO_AUTH_MODE}
      SCREEGO_CLOSE_ROOM_WHEN_OWNER_LEAVES: ${SCREEGO_CLOSE_ROOM_WHEN_OWNER_LEAVES}
      SCREEGO_TRUST_PROXY_HEADERS: ${SCREEGO_TRUST_PROXY_HEADERS}
      SCREEGO_LOG_LEVEL: ${SCREEGO_LOG_LEVEL}
